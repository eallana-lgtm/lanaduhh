<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Banner com Imagem de Fundo e Título no Lado Direito -->
    <section class="banner-hero">
        <h1 class="titulo">Meu Catálogo</h1>
    </section>

    <!-- Conteúdo principal abaixo do banner -->
    <div class="site-container">
        <header class="header">
            <a href="formulario2.html" class="btn-voltar">← Cadastrar Novo</a>
        </header>

        <main>
            <!-- Coleção com os discos estruturados para exibição imediata -->
            <div id="colecao">
                <div class="card-item">
                    <div class="disco-conteudo">
                        <h3>Queen - Monopoly (Vinyl)</h3>
                        <p>Edição especial com encarte exclusivo</p>
                    </div>
                </div>

                <div class="card-item">
                    <div class="disco-conteudo">
                        <h3>Daft Punk - Discovery</h3>
                        <p>Capa lenticular clássica</p>
                    </div>
                </div>

                <div class="card-item">
                    <div class="disco-conteudo">
                        <h3>Def Leppard - Hysteria</h3>
                        <p>Capa icónica de 1987</p>
                    </div>
                </div>

                <div class="card-item">
                    <div class="disco-conteudo">
                        <h3>Led Zeppelin - Physical Graffiti</h3>
                        <p>Capa dupla com janelas</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
