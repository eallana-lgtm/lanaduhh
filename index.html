<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Banner Superior com Imagem de Fundo e Título à Direita -->
    <section class="banner-hero">
        <h1 class="titulo">Meu Catálogo</h1>
    </section>

    <!-- Conteúdo principal -->
    <div class="site-container">
        <header class="header">
            <a href="formulario2.html" class="btn-voltar">← Cadastrar Novo</a>
        </header>

        <main>
            <div id="colecao">
                <!-- Disco 1: Atalyba e A Firma -->
                <div class="card-item" data-audio="feminina.mp3">
                    <div class="texto-disco">
                        <h3>Atalyba e A Firma</h3>
                        <p>Feminina</p>
                    </div>
                    <div class="selo-central">
                        <span>ATALYBA</span>
                    </div>
                </div>

                <!-- Disco 2: Marina Lima -->
                <div class="card-item" data-audio="nao-sei-dancar.mp3">
                    <div class="texto-disco">
                        <h3>Marina Lima</h3>
                        <p>Não Sei Dançar</p>
                    </div>
                    <div class="selo-central">
                        <span>MARINA LIMA</span>
                    </div>
                </div>

                <!-- Disco 3: Angra -->
                <div class="card-item" data-audio="wuthering-heights.mp3">
                    <div class="texto-disco">
                        <h3>Angra</h3>
                        <p>Wuthering Heights</p>
                    </div>
                    <div class="selo-central">
                        <span>ANGRA</span>
                    </div>
                </div>

                <!-- Disco 4: Jeff Buckley -->
                <div class="card-item" data-audio="lover-you-shouldve-come-over.mp3">
                    <div class="texto-disco">
                        <h3>Jeff Buckley</h3>
                        <p>Lover, You Should've Come Over</p>
                    </div>
                    <div class="selo-central">
                        <span>JEFF BUCKLEY</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
